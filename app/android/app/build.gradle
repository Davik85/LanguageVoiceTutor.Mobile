plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Operator-supplied existing Firebase app configuration. Without it the app
// still compiles and optional analytics remains unavailable.
if (file("google-services.json").isFile()) {
    def firebaseClient = new groovy.json.JsonSlurper().parse(file("google-services.json"))
    def expectedPackage = "com.languagevoicetutor.mobile"
    if (firebaseClient.project_info?.project_id != "orralen-lvt-production" ||
        !firebaseClient.client?.any { it.client_info?.android_client_info?.package_name == expectedPackage }) {
        throw new GradleException("Firebase configuration does not match the approved project/package.")
    }
    apply plugin: "com.google.gms.google-services"
}

def releaseSigningProperties = new Properties()
def releaseStoreFile = null
def releaseSigningConfigurationError = null
def keyPropertiesFile = rootProject.file("key.properties")

if (!keyPropertiesFile.isFile()) {
    releaseSigningConfigurationError =
        "Release signing configuration is missing: app/android/key.properties does not exist."
} else {
    keyPropertiesFile.withInputStream { releaseSigningProperties.load(it) }

    def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingSigningProperties = requiredSigningProperties.findAll {
        !releaseSigningProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        releaseSigningConfigurationError =
            "Release signing configuration is incomplete: required key.properties values are missing or blank."
    } else {
        releaseStoreFile = file(releaseSigningProperties.getProperty("storeFile").trim())
        if (!releaseStoreFile.isFile()) {
            releaseSigningConfigurationError =
                "Release signing configuration is invalid: the configured keystore file does not exist."
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def appReleaseTaskInGraph = taskGraph.allTasks.any { task ->
        task.project.path == project.path &&
            task.name.toLowerCase(java.util.Locale.ROOT).contains("release")
    }
    if (appReleaseTaskInGraph && releaseSigningConfigurationError != null) {
        throw new GradleException(releaseSigningConfigurationError)
    }
}

android {
    namespace = "com.languagevoicetutor.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.languagevoicetutor.mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigurationError == null) {
                storeFile = releaseStoreFile
                storePassword = releaseSigningProperties.getProperty("storePassword").trim()
                keyAlias = releaseSigningProperties.getProperty("keyAlias").trim()
                keyPassword = releaseSigningProperties.getProperty("keyPassword").trim()
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
